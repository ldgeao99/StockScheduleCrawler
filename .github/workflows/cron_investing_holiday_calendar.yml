name: crawl_investing_holiday_calendar (Monthly)

on:
  schedule:
    # 한국 시간(KST) 매월 1일 오전 06시 실행 목표. UTC 1일 21:00으로 걸면 KST로는 2일 06시가 되어버리므로,
    # 매월 마지막날(28~31일) 21:00 UTC에 걸어두고 스크립트 내부에서 KST 기준 1일인지 재확인함
    - cron: '0 21 28-31 * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-cloud-firestore urllib3

    # 🔑 파이어베이스 서비스 계정 보안 키 디코딩 주입
    - name: Decode Firebase Key
      run: |
        echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 --decode > stockcalender-13042-firebase-adminsdk-fbsvc-18b1748d9a.json

    - name: Run Global Holiday Crawler
      run: |
        # 기존에 등록된 파일명인 crawl_investing_holiday_calendar.py를 호출합니다.
        python crawl_investing_holiday_calendar.py